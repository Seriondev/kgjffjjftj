name: Build Peak Recorder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Generate project files
        run: |
          cat > settings.gradle <<'TS_EOF_0'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'transparent-skin'
          TS_EOF_0
          cat > build.gradle <<'TS_EOF_1'
          plugins {
              id 'fabric-loom' version '1.11-SNAPSHOT'
          }

          version = '1.0.0'
          group = 'com.vizkovico'

          base {
              archivesName = 'peak-recorder'
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:1.21.10"
              mappings "net.fabricmc:yarn:1.21.10+build.3:v2"
              modImplementation "net.fabricmc:fabric-loader:0.17.2"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.138.4+1.21.10"
          }

          processResources {
              inputs.property "version", project.version

              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          TS_EOF_1
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'TS_EOF_2'
          {
            "schemaVersion": 1,
            "id": "peakrecorder",
            "version": "${version}",
            "name": "Peak Recorder",
            "description": "Rekam frame layar (termasuk GUI) ke folder screenshots. F9 mulai/berhenti, F10 ganti fps.",
            "authors": ["Anonymous"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.vizkovico.peakrecorder.PeakRecorderMod"]
            },
            "mixins": ["peakrecorder.mixins.json"],
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "1.21.10",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          TS_EOF_2
          mkdir -p src/main/resources
          cat > src/main/resources/peakrecorder.mixins.json <<'TS_EOF_3'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.vizkovico.peakrecorder.mixin",
            "compatibilityLevel": "JAVA_21",
            "mixins": [],
            "client": [
              "GameRendererRecorderMixin"
            ],
            "injectors": {
              "defaultRequire": 0
            }
          }
          TS_EOF_3
          mkdir -p src/main/java/com/vizkovico/peakrecorder
          cat > src/main/java/com/vizkovico/peakrecorder/PeakRecorderMod.java <<'TS_EOF_4'
          package com.vizkovico.peakrecorder;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.client.util.ScreenshotRecorder;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          import java.util.function.Consumer;

          public class PeakRecorderMod implements ClientModInitializer {
              private static final int[] FPS_OPTIONS = {30, 20, 10, 5};
              private static KeyBinding toggleKey;
              private static KeyBinding speedKey;
              private static boolean on = false;
              private static int fpsIndex = 0;
              private static long lastCapture = 0L;
              private static int saved = 0;

              @Override
              public void onInitializeClient() {
                  toggleKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.peakrecorder.toggle", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_F9, KeyBinding.Category.MISC));
                  speedKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.peakrecorder.speed", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_F10, KeyBinding.Category.MISC));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null) {
                          return;
                      }
                      while (speedKey.wasPressed()) {
                          fpsIndex = (fpsIndex + 1) % FPS_OPTIONS.length;
                          client.inGameHud.setOverlayMessage(Text.literal("Rekam: " + FPS_OPTIONS[fpsIndex] + " fps"), false);
                      }
                      while (toggleKey.wasPressed()) {
                          on = !on;
                          saved = 0;
                          client.inGameHud.setOverlayMessage(Text.literal(on
                                  ? "REKAM: ON (" + FPS_OPTIONS[fpsIndex] + " fps)"
                                  : "REKAM: OFF, " + saved + " frame"), false);
                      }
                  });
              }

              /** dipanggil dari mixin setiap frame render, termasuk saat GUI terbuka */
              public static void onFrame() {
                  if (!on) {
                      return;
                  }
                  long now = System.currentTimeMillis();
                  long interval = 1000L / FPS_OPTIONS[fpsIndex];
                  if (now - lastCapture < interval) {
                      return;
                  }
                  lastCapture = now;
                  try {
                      ScreenshotRecorder.takeScreenshot(MinecraftClient.getInstance().getFramebuffer(), (Consumer<Text>) t -> {
                      });
                      saved++;
                  } catch (Throwable ignored) {
                  }
              }
          }
          TS_EOF_4
          mkdir -p src/main/java/com/vizkovico/peakrecorder/mixin
          cat > src/main/java/com/vizkovico/peakrecorder/mixin/GameRendererRecorderMixin.java <<'TS_EOF_5'
          package com.vizkovico.peakrecorder.mixin;

          import com.vizkovico.peakrecorder.PeakRecorderMod;
          import net.minecraft.client.render.GameRenderer;
          import net.minecraft.client.render.RenderTickCounter;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(GameRenderer.class)
          public abstract class GameRendererRecorderMixin {

              @Inject(method = "render(Lnet/minecraft/client/render/RenderTickCounter;Z)V", at = @At("TAIL"), require = 0)
              private void pr$recordFrame(RenderTickCounter tickCounter, boolean tick, CallbackInfo ci) {
                  try {
                      PeakRecorderMod.onFrame();
                  } catch (Throwable ignored) {
                  }
              }
          }
          TS_EOF_5

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: peak-recorder
          path: build/libs/*.jar
